<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Sign in</title>
<script>try{if(sessionStorage.getItem(location.pathname+":signin.theme")==="light")document.documentElement.classList.add("light")}catch(e){}</script>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/static/auth.css">
<script src="/static/auth.js" defer></script>
</head>
<body>
<div id="auth-shell" class="auth-shell">
  <div class="auth-card">
    <div class="auth-mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg></div>
    <div class="auth-kicker" id="auth-kicker">PRIVATE ACCESS</div>
    <h1 id="auth-title">Sign in</h1>
    <p class="auth-sub" id="auth-sub">Enter your credentials to continue</p>
    <form id="auth-form" autocomplete="on">
      <label id="auth-setup-code-wrap" class="hidden">Bootstrap code
        <input type="password" id="auth-setup-code" autocomplete="one-time-code" spellcheck="false">
      </label>
      <label>Username<input type="text" id="auth-user" autocomplete="username" required></label>
      <label>Password<input type="password" id="auth-pass" autocomplete="current-password" required></label>
      <label id="auth-pass2-wrap" class="hidden">Repeat password<input type="password" id="auth-pass2" autocomplete="new-password"></label>
      <div class="form-error hidden" id="auth-err" role="alert"></div>
      <button class="btn btn-pri btn-wide" id="auth-submit" type="submit" disabled>Sign in</button>
    </form>
  </div>
</div>
</body>
</html>
