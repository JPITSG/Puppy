<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){var ns=location.pathname.replace(/\/$/,"");if(localStorage.getItem((ns?ns+":":"")+"puppy.theme")==="light")document.documentElement.classList.add("light")})()</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Puppy Console</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/static/vendor/xterm.css?v=__V__">
<link rel="stylesheet" href="/static/auth.css?v=__V__">
<link rel="stylesheet" href="/static/app.css?v=__V__">
</head>
<body>

<!-- main app -->
<div id="app" class="app hidden">
  <div id="drawer-edge" class="drawer-edge" aria-hidden="true"></div>
  <div id="side-backdrop" class="side-backdrop"></div>
  <aside id="side" class="side">
    <div class="side-actions">
      <button class="btn btn-pri btn-wide" id="btn-new-session"><span class="btn-ico" aria-hidden="true"></span>New session</button>
    </div>
    <div class="side-scroll">
      <div id="sess-groups"></div>
      <button class="linklike" id="toggle-archived">Show archived</button>
    </div>
    <div class="side-search" id="side-search">
      <input type="text" id="side-search-input" placeholder="Search sessions"
        aria-label="Search sessions" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="side-search-btn" id="side-search-adv" type="button"
        aria-label="Advanced search"></button>
      <button class="side-search-btn" id="side-search-go" type="button" aria-label="Search"></button>
    </div>
    <div class="side-foot">
      <div class="foot-engines" id="foot-engines"></div>
      <div class="foot-row">
        <button class="icon-btn" id="btn-settings" aria-label="Settings"></button>
        <button class="icon-btn" id="btn-theme" aria-label="Toggle light/dark mode"></button>
        <button class="icon-btn hidden" id="btn-bell" aria-label="Completion alerts"></button>
        <button class="icon-btn" id="btn-logout" aria-label="Sign out"></button>
        <span class="conn-state">
          <span class="host-cpu hidden" id="host-cpu"></span>
          <span class="conn-dot" id="conn-dot" role="img" aria-label="Connection status"></span>
        </span>
      </div>
    </div>
    <div class="side-resize" id="side-resize" role="separator"
      aria-orientation="vertical" aria-label="Resize sidebar"></div>
  </aside>

  <main class="main">
    <div class="workspace" id="workspace">
      <div class="workspace-tree" id="workspace-tree"></div>
      <div class="empty-hint" id="empty-hint">
        <div class="empty-paw"><svg viewBox="0 0 24 24" width="46" height="46" fill="currentColor"><path d="M11 3 Q12.5 11.5 21 13 Q12.5 14.5 11 23 Q9.5 14.5 1 13 Q9.5 11.5 11 3 Z"/><path opacity=".85" d="M19.5 1 Q20.2 4.3 23.5 5 Q20.2 5.7 19.5 9 Q18.8 5.7 15.5 5 Q18.8 4.3 19.5 1 Z"/></svg></div>
        <p>No tabs open.<br>Create a session or open one from the left.</p>
      </div>
    </div>
    <div class="menu hidden" id="tab-add-menu">
      <button data-act="open-session">Open session</button>
      <button data-act="new-session">New session</button>
      <button data-act="new-terminal">New terminal</button>
      <button data-act="new-browser">New browser</button>
      <button data-act="new-vnc">New VNC connection</button>
      <button data-act="search">Search</button>
    </div>
  </main>
</div>

<div id="modal-root"></div>
<div id="toasts" class="toasts" role="status" aria-live="polite" aria-atomic="false"></div>

<script src="/static/vendor/marked.min.js?v=__V__" defer></script>
<script src="/static/vendor/purify.min.js?v=__V__" defer></script>
<script src="/static/vendor/xterm.min.js?v=__V__" defer></script>
<script src="/static/vendor/addon-fit.min.js?v=__V__" defer></script>
<script src="/static/app.js?v=__V__" defer></script>
</body>
</html>
