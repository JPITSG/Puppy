; Puppy - AI coding session manager
; install: cp puppy.supervisor.conf /etc/supervisor/conf.d/puppy.conf && supervisorctl update
[program:puppy]
command=/etc/scripts/puppy/run.sh
directory=/etc/scripts/puppy
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor.stdout.puppy.log
stderr_logfile=/var/log/supervisor.stderr.puppy.log
user=root
environment=HOME=/root,PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin,PYTHONUNBUFFERED=1
stopsignal=TERM
; must exceed sessions.shutdown_grace (60s): puppy waits for in-flight agent
; turns to finish before exiting so restarts don't kill them mid-answer
stopwaitsecs=75
startsecs=0
startretries=1000000
