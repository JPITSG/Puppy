; Puppy headless backend - adjust paths, user, bind address, and logs.
; The launcher must be supervised for health-checked upgrades and rollback.
[program:puppy-backend]
command=/opt/puppy-backend/venv/bin/python /opt/puppy-backend/puppy-backend-launcher.py --artifact /var/lib/puppy-backend/puppy-backend.pyz --state-dir /var/lib/puppy-backend/upgrade -- serve --data-dir /var/lib/puppy-backend --bind 127.0.0.1 --port 10888 --auto-tls --enable-remote-upgrade
directory=/var/lib/puppy-backend
user=puppy
environment=HOME="/var/lib/puppy-backend",PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",PYTHONUNBUFFERED="1"
umask=0077
autostart=true
autorestart=true
startsecs=2
startretries=10
stopsignal=TERM
stopwaitsecs=75
stdout_logfile=/var/log/supervisor.stdout.puppy-backend.log
stderr_logfile=/var/log/supervisor.stderr.puppy-backend.log
